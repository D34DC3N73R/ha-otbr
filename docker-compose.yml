services:
  otbr:
    container_name: otbr
    image: ghcr.io/d34dc3n73r/ha-otbr:stable
    restart: unless-stopped

    # Host networking is REQUIRED for proper IPv6 multicast, mDNS, and Thread TREL
    network_mode: host

    # Matches the add-on's privileged list. NET_RAW is already in Docker's
    # default set. If s6 fails to start, try adding SYS_ADMIN.
    cap_add:
      - NET_ADMIN  # wpan0 interface, iptables/ipset, routing table
      - IPC_LOCK

    environment:
      # ===== REQUIRED: Thread Radio Configuration =====

      # USB serial device path (use EITHER this OR NETWORK_DEVICE, not both)
      # Find yours with: ls -la /dev/ttyUSB* /dev/ttyACM*
      DEVICE: "/dev/ttyUSB0"

      # Network-connected radio (TCP address) - alternative to USB serial
      # Uncomment to use network radio instead of USB:
      # NETWORK_DEVICE: "192.168.1.100:5000"

      # Primary network interface for Thread routing
      # Find yours with: ip route show default | awk '{print $5}'
      # Common values: eth0, enp5s0, ens18, wlan0
      # If unset, the interface holding the default route is used; the container
      # exits if that cannot be determined.
      BACKBONE_IF: eth0

      # ===== OPTIONAL: Service Enablement =====

      # REST API (Home Assistant integration) - must be port 8081
      # - Set to 8081: API binds to all interfaces (accessible from network)
      # - Unset/comment: API binds to localhost only (secure default)
      OTBR_REST_PORT: 8081

      # Web UI - can be any port
      # - Set to enable web interface (typically 8080)
      # - Unset/comment to disable web UI
      OTBR_WEB_PORT: 8080

      # ===== OPTIONAL: Radio Settings =====
      # These mirror the add-on's own defaults, so leaving one out keeps the
      # add-on's behaviour rather than turning the feature off.

      # Serial baudrate (common: 115200, 230400, 460800). Default: 460800
      BAUDRATE: 460800

      # Hardware flow control. Default: enabled
      # 1/true/yes/on = enabled (recommended for high baudrates)
      # 0/false/no/off = disabled
      FLOW_CONTROL: 1

      # ===== OPTIONAL: Network & Security =====

      # Enable Thread ingress firewall (recommended). Default: enabled
      FIREWALL: 1

      # Enable NAT64 for Thread devices to access IPv4 internet. Default: disabled
      NAT64: 1

      # ===== OPTIONAL: Advanced Features =====

      # Beta mode: run the pre-release OTBR build instead of the stable one
      # 0 = disabled/stable (default)
      # 1 = enabled/beta - newer, unreleased OTBR build
      # Since HA OTBR 3.0.0 both modes use Thread 1.4 and OpenThread's built-in
      # mDNS; BETA only selects a newer OTBR build. Thread 1.4 firmware on the
      # radio is required either way (flash it yourself - the add-on dropped
      # built-in firmware flashing upstream).
      BETA: 0

      # ===== OPTIONAL: Logging =====

      # Log level: debug, info, notice, warning, error, critical, alert, emergency
      # Default: notice. Applies to both otbr-agent and the web UI.
      OTBR_LOG_LEVEL: info

    devices:
      # Expose Thread radio device (comment out if using NETWORK_DEVICE)
      - /dev/ttyUSB0:/dev/ttyUSB0

      # Required for Thread network interface (wpan0)
      - /dev/net/tun:/dev/net/tun

    volumes:
      # Persist Thread network settings across container restarts
      # This stores network credentials, child device info, etc.
      - ./otbr-data:/data/thread

      # Sync container time with host
      - /etc/localtime:/etc/localtime:ro

    # Reuses the readiness check the image already ships: Thread socket present
    # and REST API accepting connections.
    healthcheck:
      test: ["CMD", "/etc/s6-overlay/s6-rc.d/otbr-agent/data/check"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
